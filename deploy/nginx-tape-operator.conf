server {
    listen 8443 ssl;
    server_name sanek2mz.duckdns.org;

    # SSL — замените на ваши пути к сертификатам
    ssl_certificate     /etc/nginx/ssl/sanek2mz.duckdns.org.crt;
    ssl_certificate_key /etc/nginx/ssl/sanek2mz.duckdns.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/Tape-Operator/player;
    index index.html;

    location = /player/api/kinobox {
        proxy_pass https://api.kinobox.tv/api/players;
        add_header Access-Control-Allow-Origin *;
        proxy_set_header Host api.kinobox.tv;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
    }

    location /player/ {
        try_files $uri $uri/ =404;
    }
}
