server {
    listen 8443 ssl;
    server_name sanek2mz.duckdns.org;

    # SSL — замените на ваши пути к сертификатам
    ssl_certificate     /etc/nginx/ssl/sanek2mz.duckdns.org.crt;
    ssl_certificate_key /etc/nginx/ssl/sanek2mz.duckdns.org.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/Tape-Operator/player;
    index index.html;

    location /player/api/kinobox {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 30s;
    }

    location /player/ {
        try_files $uri $uri/ =404;
    }
}
