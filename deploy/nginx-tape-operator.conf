# Шаблон nginx-сайта Tape Operator (selfhost).
# deploy/install.sh подставляет __DOMAIN__, __PORT__, __WWW_DIR__
# и выпускает/использует LetsEncrypt-сертификат для __DOMAIN__.
server {
    listen __PORT__ ssl http2;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;

    location = /tape-operator.user.js {
        alias __WWW_DIR__/tape-operator.user.js;
        default_type text/javascript;
        charset utf-8;
        expires 1d;
        add_header Cache-Control "max-age=86400";
    }

    location /player/api/kinobox {
        proxy_pass http://127.0.0.1:8787;
        proxy_read_timeout 30s;
    }

    location /player/ {
        alias __WWW_DIR__/player/;
        try_files $uri $uri/ /player/index.html;
        expires 1d;
        add_header Cache-Control "max-age=86400";
        autoindex off;
    }

    location / {
        return 200 OK;
        add_header Content-Type text/plain;
    }
}
